# Déploiement complet : http://localhost:8080  (API : /api/v1, documentation : /api/v1/docs)
services:
  backend:
    build: ./backend
    environment:
      PLANNER_ENVIRONMENT: production
      PLANNER_CORS_ORIGINS: '["http://localhost:8080"]'
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    environment:
      API_UPSTREAM: http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
