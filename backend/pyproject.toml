[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tana-transport-planner"
version = "2.0.0"
description = "Planificateur d'itinéraires de transport d'Antananarivo (hiérarchie administrative, règles déterministes, sans IA)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# Nécessaire uniquement pour reconstruire data/processed/ (pas au runtime de l'API).
pipeline = ["pandas>=2.2", "openpyxl>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
planner = "planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`:Warning"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]
